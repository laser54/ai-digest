# Existing production, single replica; jobs are process-local.
# ACME enabled after protected cutover and authoritative DNS verification.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3030"
      HOME: /codex
      CODEX_HOME: /codex
    volumes:
      - codex-data:/codex
    networks: [coolify]
    dns: [1.1.1.1, 8.8.8.8]
    expose: ["3030"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.aidigest-http.rule=Host(`ai-digest.larin.work`)
      - traefik.http.routers.aidigest-http.entrypoints=http
      - traefik.http.routers.aidigest-http.middlewares=redirect-to-https@file
      - traefik.http.routers.aidigest-http.service=aidigest
      - traefik.http.routers.aidigest-https.rule=Host(`ai-digest.larin.work`)
      - traefik.http.routers.aidigest-https.entrypoints=https
      - traefik.http.routers.aidigest-https.tls=true
      - traefik.http.routers.aidigest-https.tls.certresolver=letsencrypt
      - traefik.http.routers.aidigest-https.service=aidigest
      - traefik.http.services.aidigest.loadbalancer.server.port=3030
networks:
  coolify:
    external: true
volumes:
  codex-data:
