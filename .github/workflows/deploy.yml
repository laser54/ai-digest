name: Validate production deployment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose -f docker-compose.coolify.yml config --quiet
      - run: docker build -t ai-digest:test .
# Production delivery is exclusively the installed Coolify GitHub App.
